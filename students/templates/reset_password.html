{% extends 'base.html' %}
{% load static %}
{% block title %}Reset_Password{% endblock %}

{% block content %}

<body>

    <div class="password-container">
        <div class="password-card">
            <div class="school-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3>Set New Password</h3>
            <p class="description">
                Create a strong new password for your account.
            </p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="new_password" name="new_password" placeholder="Enter new password"
                            required>
                        <i class="fa-regular fa-eye toggle-password" data-target="#new_password"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirm_password" name="confirm_password"
                            placeholder="Confirm new password" required>
                        <i class="fa-regular fa-eye toggle-password" data-target="#confirm_password"></i>
                    </div>
                </div>
                <button type="submit" class="password-btn">
                    Set Password <i class="fa-solid fa-check"></i>
                </button>
            </form>
            <div class="back-login">
                <a href="{% url 'admin_login_page' %}">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Login
                </a>
            </div>
            <div class="footer-text">
                © 2026 Shanti Niketan Public School
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {

            // Show / Hide Password
            $(".toggle-password").click(function () {

                let target = $(this).attr("data-target");
                let input = $(target);

                if (input.attr("type") === "password") {
                    input.attr("type", "text");
                    $(this).removeClass("fa-eye").addClass("fa-eye-slash");
                } else {
                    input.attr("type", "password");
                    $(this).removeClass("fa-eye-slash").addClass("fa-eye");
                }

            });

            // Password Validation
            $("#resetPasswordForm").on("submit", function (e) {

                e.preventDefault();

                let password = $("#new_password").val();
                let confirmPassword = $("#confirm_password").val();

                if (password.length < 8) {
                    alert("Password must contain at least 8 characters.");
                    return;
                }

                if (password !== confirmPassword) {
                    alert("New password and confirm password do not match.");
                    return;
                }

                alert("Password validation successful!");

                // Connect Django password reset logic here.

            });

        });
    </script>
</body>

{% endblock %}
