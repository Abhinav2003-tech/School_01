{% extends 'base.html' %}
{% load static %}
{% block title %}Forgot_Password{% endblock %}

{% block content %}

<body>
    <div class="password-container">
        <div class="password-card">
            <div class="school-icon">
                <i class="fa-solid fa-school"></i>
            </div>
            <h3>Forgot Password?</h3>
            <p class="description">
                Enter your registered email address and verification
                code to verify your identity.
            </p>

            <form id="verifyForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="verification_code">Verification Code</label>

                    <div class="input-box">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="text" id="verification_code" name="verification_code"
                            placeholder="Enter verification code" maxlength="6" required>
                    </div>
                </div>

                <button type="submit" class="password-btn">
                    Verify <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="back-login">
                <a href="{% url 'admin_login_page' %}">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Login
                </a>
            </div>

            <div class="footer-text">
                © 2026 Shanti Niketan Public School
            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#verifyForm").on("submit", function (e) {
                e.preventDefault();

                let email = $("#email").val().trim();
                let code = $("#verification_code").val().trim();

                if (email === "" || code === "") {
                    alert("Please fill all fields.");
                    return;
                }

                // Frontend demo navigation.
                // Actual verification will be handled by Django.
                window.location.href = "{% url 'reset_password' %}";

            });

        });
    </script>

</body>
{% endblock %}
